function getWakalaStickers(d){if(!d.wakalaStickers||d.wakalaStickers.length===0){d.wakalaStickers=getDefaultWakalaStickers();}else{const defaults=getDefaultWakalaStickers();const defByName={};defaults.forEach(def=>{defByName[def.network.toUpperCase()]=def;});let changed=false;d.wakalaStickers.forEach(s=>{const def=defByName[(s.network||'').toUpperCase()];if(def){if(s.c1!==def.c1||s.c2!==def.c2||s.headerImg!==def.headerImg||s.nameColor!==def.nameColor||s.labelColor!==def.labelColor||s.tagline!==def.tagline||s.category!==def.category){s.c1=def.c1;s.c2=def.c2;s.headerImg=def.headerImg;s.nameColor=def.nameColor;s.labelColor=def.labelColor;s.tagline=def.tagline;s.category=def.category;changed=true;}}else if(!s.category){s.category='till';changed=true;}});const existingNames=d.wakalaStickers.map(s=>(s.network||'').toUpperCase());defaults.forEach(def=>{if(!existingNames.includes(def.network.toUpperCase())){d.wakalaStickers.push(def);changed=true;}});if(changed)saveSheetsDebounced();}return d.wakalaStickers;}function renderStickerCarouselHtml(d,editOn,category){const fullList=getWakalaStickers(d);const indexed=fullList.map((s,i)=>({s,i}));const filtered=category?indexed.filter(x=>(x.s.category||'till')===category):indexed;const cards=filtered.map(({s,i})=>{return `<div class="sticker-card" style="background:linear-gradient(135deg,${s.c1},${s.c2});" data-sticker-idx="${i}"><div class="sticker-inner"><img class="sticker-header-img" src="${s.headerImg}"><div class="sticker-label-row"><span class="ln"></span><span class="sticker-label">Namba ya Wakala</span><span class="ln"></span></div><div class="sticker-box"><span class="sb-code">${esc(s.code)}</span></div><div class="sticker-label-row"><span class="ln"></span><span class="sticker-label" style="color:${s.labelColor||'#fff'};">Jina la Wakala</span><span class="ln"></span></div><div class="sticker-box"><span class="sb-name" style="color:${s.nameColor||'#111'};">${esc(s.jina)}</span></div><div class="sticker-tagline">${esc(s.tagline||'')}</div></div><button class="sticker-dl-btn" data-sticker-dl="${i}">📥 Pakua Picha</button></div>`;}).join('');const dots=filtered.map(()=>'<span class="sticker-dot"></span>').join('');const editRows=editOn?`<div style="margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);"><p style="font-size:12px;font-weight:800;color:var(--ink-soft);margin:0 0 10px;">✏️ Hariri Namba na Majina</p>${filtered.map(({s,i})=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span style="font-size:11px;font-weight:800;color:var(--ink-soft);flex:0 0 90px;">${esc(s.network)}</span><input type="text" data-stk-code="${i}" value="${esc(s.code)}" placeholder="Namba" style="flex:1;min-width:0;"><input type="text" data-stk-jina="${i}" value="${esc(s.jina)}" placeholder="Jina" style="flex:1;min-width:0;"></div>`).join('')}</div>`:'';return `<div class="sticker-carousel" id="stickerCarousel">${cards}</div><div class="sticker-dots">${dots}</div>${editRows}`;}function renderKamisheniCardHtml(d){const list=kamisheniMweziHuu(d);const total=list.reduce((s,k)=>s+(k.kiasi||0),0);const rows=KAMISHENI_NETWORKS.map((net,i)=>{const entry=list.find(k=>k.mtandao===net);return`<div class="tkw-row"><div class="tkw-num">${networkLogoHtml(net,16)}</div><span class="tkw-label">${net}</span><span class="tkw-val" style="${entry?'color:#4ADE80;':'color:#8A8D9A;'}">${entry?fmtMoney(entry.kiasi):'Bado'}</span></div>`;}).join('');return`<div class="tkw-card"><div class="tkw-head"><h3>💰 Kamisheni ya Mitandao</h3><span>Mwezi Huu</span></div><div class="tkw-body">${rows}<div class="tkw-row tkw-final"><div class="tkw-num">Σ</div><span class="tkw-label">Jumla Mwezi Huu</span><span class="tkw-val" style="color:#D4A62C;">${fmtMoney(total)}</span></div></div><p style="font-size:11px;color:#8A8D9A;margin:0;padding:0 16px 14px;line-height:1.5;">💡 Kamisheni hii huongeza Float ya mtandao husika moja kwa moja unapoiingiza. Ongeza kamisheni mpya kwenye tab ya <strong style="color:#C4C6D0;">Data</strong>.</p></div>`;}function renderKamisheniForm(d){const wrap=document.getElementById('kamisheniFormWrap');if(!wrap)return;if(!APP.kamisheniFormOpen){wrap.innerHTML='';return;}const editEntry=APP.kamisheniEditNet?d.mtandaoKamisheni.find(k=>k.mtandao===APP.kamisheniEditNet&&k.mwezi===currentMonthStr()):null;const netOptions=KAMISHENI_NETWORKS.map(n=>`<option value="${n}" ${editEntry&&editEntry.mtandao===n?'selected':''}>${n}</option>`).join('');wrap.innerHTML=`<div class="txform">${editEntry?`<p class="pay-hint">✏️ Unahariri kamisheni ya ${esc(editEntry.mtandao)}</p>`:''}<div class="frow"><label>Mtandao</label><select id="km-mtandao">${netOptions}</select></div><div class="frow"><label>Kiasi cha Kamisheni</label><input type="text" inputmode="decimal" id="km-kiasi" class="amt" placeholder="0" value="${editEntry?fmt(editEntry.kiasi):''}"></div><div class="frow"><label>Tarehe Imepokelewa</label><input type="date" id="km-tarehe" value="${editEntry?editEntry.tarehe:today()}"></div><div class="fbtns"><button class="btn-primary" id="km-save">Hifadhi Kamisheni</button><button class="btn-ghost" id="km-cancel">Ghairi</button></div></div>`;wrap.querySelector('#km-kiasi').addEventListener('input',e=>liveFormatAmount(e.target));wrap.querySelector('#km-cancel').addEventListener('click',()=>{APP.kamisheniFormOpen=false;APP.kamisheniEditNet=null;renderDataTabContent(document.getElementById('main'));});wrap.querySelector('#km-save').addEventListener('click',()=>{const mtandao=wrap.querySelector('#km-mtandao').value;const kiasi=parseNum(wrap.querySelector('#km-kiasi').value);const tarehe=wrap.querySelector('#km-tarehe').value||today();const mwezi=tarehe.slice(0,7);if(kiasi<=0){showToast('Weka kiasi sahihi cha kamisheni');return;}const existing=d.mtandaoKamisheni.find(k=>k.mtandao===mtandao&&k.mwezi===mwezi);const oldKiasi=existing?(existing.kiasi||0):0;const delta=kiasi-oldKiasi;if(existing){existing.kiasi=kiasi;existing.tarehe=tarehe;}else{d.mtandaoKamisheni.push({id:uid(), or.clipboard){navigator.clipboard.writeText(ta.value).then(()=>showToast('✅ Imenakiliwa')).catch(()=>showToast('Bonyeza na kushikilia maandishi kunakili mwenyewe'));}else{showToast('Bonyeza na kushikilia maandishi kunakili mwenyewe');}}catch(err){console.error('Copy failed',err);showToast('Bonyeza na kushikilia maandishi kunakili mwenyewe');}});const closeBtn=document.getElementById('backupCloseBtn');if(closeBtn)closeBtn.addEventListener('click',()=>{modal.remove();});}function renderSettingsTabContent(main){const dashPhotos=loadDashPhotos();main.innerHTML=`<h2 class="section-title">${t('t_mipangilio')}</h2><p style="text-align:center;font-size:10px;color:var(--ink-soft);margin:-8px 0 12px;">Toleo: 2026-08-08 16:29 (Risiti Fix v3)</p><div class="card"><div class="card-head c-blue"><span>📅 Hali ya Bando</span></div><div class="card-body">${(APP.cloudOwnerUnlocked==='1'||storageGet('ownerUnlocked')==='1')?`<p style="font-size:12.5px;color:var(--green);font-weight:800;margin:0;">✅ Mmiliki (Milele) — Hakuna Ukomo</p>`:(()=>{const subExpiry=APP.cloudSubscriptionExpiry||storageGet('subscriptionExpiry');if(subExpiry){const daysLeft=Math.ceil((new Date(subExpiry)-new Date(today()))/86400000);return `<p style="font-size:12.5px;color:${daysLeft>3?'var(--green)':'var(--red)'};font-weight:800;margin:0 0 8px;">${daysLeft>0?'✅ Bando linaisha baada ya siku '+daysLeft+' ('+esc(formatDateDMY(subExpiry))+')':'⚠️ Bando limekwisha'}</p>`;}const installDate=ensureInstallDate();const daysSince=Math.floor((new Date(today())-new Date(installDate))/86400000);const daysLeft=Math.max(0,TRIAL_DAYS-daysSince);return `<p style="font-size:12.5px;color:${daysLeft>2?'var(--ink-soft)':'var(--red)'};font-weight:700;margin:0 0 8px;">⏳ Siku za kujaribu bila malipo zilizobaki: ${daysLeft}</p>`;})()}<div style="background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;margin-bottom:10px;"><div style="font-size:10px;color:var(--ink-soft);">Namba ya Kifaa Hiki< arifa zako zote kwenye faili moja. Ihifadhi Google Drive au utume WhatsApp kwako mwenyewe kila wiki kwa usalama wa ziada.</p><button class="btn-ghost" id="downloadBackupBtnMain" style="width:100%;color:var(--blue);border-color:var(--blue);">⬇️ Pakua Nakala ya Data Sasa</button></div></div>${!(FB_OK&&APP.currentUser)?`<div class="card"><div class="card-head c-orange"><span>👥 Wafanyakazi & Wingu</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;">🔌 Kipengele hiki (kuongeza wafanyakazi, kuhifadhi data kwenye wingu, kurejesha miamala) kinahitaji muunganisho wa intaneti na akaunti ya Wingu. ${!FB_OK?'Huduma ya Wingu haijapakia kwa sasa — jaribu kufunga na kufungua App upya ukiwa na intaneti.':'Bado hujaingia kwenye akaunti ya Wingu.'}</p>${FB_OK?`<p style="font-size:11px;color:var(--orange);background:var(--orange-soft);padding:8px 10px;border-radius:8px;margin:0 0 10px;line-height:1.5;">💡 Miamala yako ya sasa (iliyo kwenye kifaa hiki) HAITAFUTWA — itapandishwa Wingu moja kwa moja baada ya kujisajili/kuingia.</p><button class="btn-primary" id="openWinguAuthBtn" style="width:100%;background:var(--blue);">☁️ Ingia / Jisajili Akaunti ya Wingu</button>`:''}</div></div>`:''}${FB_OK&&APP.currentUser?`<div class="card"><div class="card-head c-green"><span>☁️ Akaunti ya Wingu</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5;">Umeingia kama: <strong>${esc(APP.currentUser?APP.currentUser.email:'')}</strong><br>Data yako inasafirishwa kiotomatiki kwenye vifaa vyako vyote.</p><div class="fbtns" style="margin-top:0;"><button class="btn-ghost" id="logoutBtn" style="color:var(--red);border-color:var(--red);">🚪 Toka (Logout)</button><button class="btn-ghost" id="testCloudSaveBtn">🧪 Jaribu Kuhifadhi Sasa</button><button class="btn-ghost" id="recoverTxBtn" style="color:var(--green);border-color:var(--green);">🛟 Rudisha Data kutoka Wingu</button></div><div style="margin-top:12px;padding:10px;background:var(--surface);border-radius:8px;font-size:10.5px;color:var(--ink-soft);font-family:monospace;"><div>Data Owner UID: ${esc((APP.dataOwnerUid||'').slice(0,20))}...</div><div>Idadi ya Sheets: ${(APP.sheets||[]).length}</div><div>Idadi ya Miamala: ${(activeSheet()&&activeSheet().data&&activeSheet().data.transactions)?activeSheet().data.transactions.length:0}</div>${(()=>{const raw=storageGet('lastSyncBalanceLog');if(!raw)return'';try{const lg=JSON.parse(raw);return `<div style="color:var(--orange);margin-top:6px;border-top:1px dashed var(--border);padding-top:6px;">🔍 Mabadiliko ya Mwisho ya Sync (${esc(lg.time)}):<br>Cash: ${esc(String(lg.oldCash))} → ${esc(String(lg.newCash))}<br>Akaunti KABLA: ${esc(lg.oldAcc)}<br>Akaunti BAADA: ${esc(lg.newAcc)}<br>Miamala: ${lg.oldTxCount} → ${lg.newTxCount}</div>`;}catch(e){return'';}})()}${storageGet('lastCloudSaveError')?`<div style="color:var(--red);margin-top:4px;">⚠️ Hitilafu ya Mwisho: ${esc(storageGet('lastCloudSaveError'))}</div>`:'<div style="color:var(--green);">✅ Hakuna hitilafu iliyorekodiwa</div>'}</div></div></div>${APP.isEmployee?`<div class="card"><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.5;">👤 Umeongezwa na mmiliki: <strong>${esc(APP.employerEmail||'')}</strong>. Unaweza kufanya kila kitu isipokuwa kuongeza wafanyakazi wengine.</p></div></div>`:`<div class="card"><div class="card-head c-orange"><span>👥 Wafanyakazi</span><button class="addrow" id="empAddBtn">${APP.employeeFormOpen?'Funga':'+ Ongeza Mfanyakazi'}</button></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5;">Mfanyakazi ataona data yote ya duka lako, lakini hawezi kuongeza mfanyakazi mwingine.</p><div id="empFormWrap"></div><div class="summary" style="margin-top:8px;">${(APP.employeesList||[]).map((emp,i)=>`<div class="srow"><span class="slabel">${esc(emp.name||emp.email)}<br><span style="font-size:11px;color:var(--ink-soft);">📱 ${esc(emp.phone||'')}</span>${emp.pin?`<br><span style="font-size:11px;color:var(--orange);font-weight:800;">🔑 PIN: ${esc(emp.pin)}</span>`:''}</span><button class="rowdel" data-emp-del="${i}">🗑</button></div>`).join('')||'<p style="font-size:12px;color:var(--ink-soft);padding:4px 2px;">Hakuna mfanyakazi bado.</p>'}</div></div></div>`}`:''}<div class="card"><div class="card-head c-blue"><span>🔑 Usalama</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Badilisha PIN yako mara kwa mara kulinda data yako.</p>${!APP.isEmployee?`<div class="fbtns" style="margin-top:0;"><button class="btn-primary" id="changePinBtn">🔑 Badilisha PIN</button></div></div></div><div class="card"><div class="card-head c-blue"><span>🔓 Swali la Kuokoa PIN</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Ukisahau PIN yako, swali hili litakusaidia kuiweka mpya. Chagua swali unalojua jibu lake wewe pekee.</p><div class="frow"><label>Swali (mfano: Jina la mnyama wako wa kwanza?)</label><input type="text" id="pinRecoveryQ" value="${esc(storageGet('pinRecoveryQ')||'')}" placeholder="Andika swali lako"></div><div class="frow"><label>Jibu</label><input type="text" id="pinRecoveryA" value="${esc(storageGet('pinRecoveryA')||'')}" placeholder="Jibu lako la siri"></div><button class="btn-primary" id="savePinRecoveryBtn" style="width:100%;">💾 Hifadhi Swali la Kuokoa</button>${(storageGet('pinRecoveryQ')&&storageGet('pinRecoveryA'))?`<p style="font-size:11px;color:var(--green);margin:8px 0 0;font-weight:700;">✅ Swali la kuokoa limeshawekwa</p>`:''}`:`<p style="font-size:11.5px;color:var(--ink-soft);margin:0;">🔒 Usalama wa PIN unasimamiwa na Mmiliki wa akaunti.</p>`}</div></div><div class="card"><div class="card-head c-purple"><span>🎨 Rangi ya App (Theme)</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Chagua rangi kuu unayoipenda zaidi.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">${THEMES.map(th=>`<button class="theme-swatch-btn ${APP.colorTheme===th.key?'active':''}" data-theme="${th.key}"><span class="theme-swatch-dot" style="background:${th.color};"></span>${th.name}</button>`).join('')}</div></div></div><div class="card"><div class="card-head c-green"><span>?? Lugha / Language</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5;">Menyu kuu na vichwa vinabadilika. Sehemu nyingine (fomu, maelezo) bado ni Kiswahili — zaidi zinakuja hivi karibuni.</p><div class="fbtns" style="margin-top:0;"><button class="${APP.lang==='sw'?'btn-primary':'btn-ghost'}" id="langSwBtn">🇹🇿 Kiswahili</button><button class="${APP.lang==='en'?'btn-primary':'btn-ghost'}" id="langEnBtn">🇬🇧 English</button></div></div></div><div class="card"><div class="card-head c-red"><span>🔔 Kikumbusho cha Kurekodi</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Ukiwa hujaandika muamala wowote kufikia saa 4 mchana, utapata arifa ya kukukumbusha.</p><div class="fbtns" style="margin-top:0;"><button class="btn-primary" id="notifBtn">🔔 Washa Kikumbusho</button></div></div></div><div class="card"><div class="card-head c-orange"><span>💡 Mwangaza wa App</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Ongeza au punguza mwangaza wa skrini ya app hii — muhimu ukiwa jua kali au chumba giza. (Haibadilishi mwangaza wa simu yenyewe.)</p><input type="range" id="brightnessSlider" min="55" max="130" value="100" style="width:100%;accent-color:var(--blue);"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;"><span>🌑 Giza</span><span id="brightnessValue" style="font-weight:700;color:var(--ink);">100%</span><span>☀️ Mwanga</span></div></div></div><div class="card"><div class="card-head c-blue"><span>🔤 Herufi (Font)</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Chagua ukubwa na aina ya herufi zinazokufaa zaidi.</p><label class="slabel" style="display:block;margin-bottom:6px;">Ukubwa wa Herufi</label><input type="range" id="fontSizeSlider" min="85" max="130" value="100" style="width:100%;accent-color:var(--blue);"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;margin-bottom:16px;"><span>🔡 Ndogo</span><span id="fontSizeValue" style="font-weight:700;color:var(--ink);">100%</span><span>🔠 Kubwa</span></div><label class="slabel" style="display:block;margin-bottom:8px;">Aina ya Herufi</label><div style="display:flex;flex-direction:column;gap:8px;"><button class="font-choice-btn" data-font="'DM Sans'" data-fontkey="dmsans" style="font-family:'DM Sans',sans-serif;">Aa — DM Sans (Kawaida)</button><button class="font-choice-btn" data-font="'Poppins'" data-fontkey="poppins" style="font-family:'Poppins',sans-serif;">Aa — Poppins (Mviringo)</button><button class="font-choice-btn" data-font="'Roboto'" data-fontkey="roboto" style="font-family:'Roboto',sans-serif;">Aa — Roboto (Wazi)</button><button class="font-choice-btn" data-font="'Merriweather'" data-fontkey="merriweather" style="font-family:'Merriweather',serif;">Aa — Merriweather (Kifahari)</button><button class="font-choice-btn" data-font="'Nunito'" data-fontkey="nunito" style="font-family:'Nunito',sans-serif;">Aa — Nunito (Rafiki)</button><button class="font-choice-btn" data-font="'Space Mono'" data-fontkey="spacemono" style="font-family:'Space Mono',monospace;">Aa — Space Mono (Kihasibu)</button></div></div></div><div class="card"><div class="card-head c-yellow"><span>🖼️ Picha za Nyumbani</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Ongeza picha zako — zitaonekana zikiteleza (scroll) juu ya Nyumbani.</p><div class="fbtns" style="margin-top:0;"><button class="btn-primary" id="addPhotoBtn">📷 Ongeza Picha</button></div><input type="file" id="photoFileInput" accept="image/*" style="display:none;"><div class="photo-scroll" style="margin-top:12px;">${dashPhotos.map((p,i)=>`<div class="photo-thumb-wrap"><img src="${p}"><button class="photo-thumb-del" data-photo-del="${i}">✕</button></div>`).join('')||'<p style="font-size:12px;color:var(--ink-soft);">Hakuna picha bado.</p>'}</div></div></div><div class="card"><div class="card-head c-blue"><span>🔒 Funga/Fungua Hesabu</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.5;">Vipengele viwili tofauti — kila kimoja unaweza kuwasha/kuzima peke yake.</p><div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;"><strong style="font-size:12.5px;">🌙 Kufunga Kiotomatiki (Saa 4 Usiku)</strong><p style="font-size:11px;color:var(--ink-soft);margin:6px 0 10px;">Salama — inahifadhi kumbukumbu tu, haibadilishi Cash/Float zako.</p><div class="fbtns" style="margin-top:0;gap:8px;"><button class="btn-ghost ${APP.autoFungaCloseEnabled?'active-sub':''}" id="fsCloseAutoBtn">🤖 Washa</button><button class="btn-ghost ${!APP.autoFungaCloseEnabled?'active-sub':''}" id="fsCloseManualBtn">✋ Zima</button></div></div><div style="border:1px solid var(--red);border-radius:10px;padding:12px;background:var(--red-soft);"><strong style="font-size:12.5px;">☀️ Kufungua Kiotomatiki (Saa 1 Asubuhi)</strong><p style="font-size:11px;color:var(--red);margin:6px 0 10px;font-weight:700;">🔒 Kipengele hiki kimezimwa kabisa kwa usalama wa data yako — kilikuwa kikiweza kufuta mabadiliko uliyoyafanya asubuhi (Matumizi, Amana, marekebisho ya Data) kabla ya kukagua kama kuna miamala. Tumia kitufe cha "🔓 Fungua Siku ya Leo" kwenye Muhtasari mwenyewe unapohitaji.</p></div></div></div><div class="card"><div class="card-head c-green"><span>💾 Hifadhi Data Sasa</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Bonyeza wakati wowote unapotaka uhakika kwamba data yako ya sasa imehifadhiwa salama — kwenye simu na wingu.</p><button class="btn-primary" id="saveNowSettingsBtn" style="width:100%;background:var(--green);">💾 Hifadhi Sasa</button></div></div>${!APP.isEmployee?`<div class="card"><div class="card-head c-green"><span>📥 Hifadhi ya Chelezo (Backup)</span></div><div class="card-body"><p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;">Pakua data yako YOTE (miamala, madeni, matumizi, akaunti) kama faili moja la usalama. Hifadhi mahali salama — WhatsApp kwako mwenyewe, Google Drive, n.k.</p><button class="btn-primary" id="downloadBackupBtn" style="width:100%;">📥 Pakua Backup Yote</button><p style="font-size:10.5px;color:var(--ink-soft);margin-top:8px;">💡 Fanya hivi mara kwa mara — mfano kila wiki.</p><div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;"><strong style="font-size:12.5px;">📤 Rejesha kutoka Backup</strong><p style="font-size:11px;color:var(--ink-soft);margin:6px 0 10px;">⚠️ Hii itabadilisha KABISA data yako ya sasa na ile ya backup. Tumia tu kama una uhakika.</p><div style="margin-bottom:10px;"><label style="font-size:11.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;">✍️ Bandika (Paste) Maandishi ya Backup Hapa</label><textarea id="restoreTextArea" placeholder="Bandika hapa maandishi uliyonakili wakati wa Backup..." style="width:100%;min-height:100px;font-family:monospace;font-size:10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box;"></textarea><button class="btn-ghost" id="restoreFromTextBtn" style="width:100%;margin-top:8px;border-color:var(--red);color:var(--red);">📋 Rejesha kutoka Maandishi Hayo</button></div><p style="font-size:10.5px;color:var(--ink-soft);text-align:center;margin:10px 0;">— AU —</p><input type="file" id="restoreFileInput" accept="application/json,.json" style="display:none;"><button class="btn-ghost" id="restoreBackupBtn" style="width:100%;border-color:var(--red);color:var(--red);">📤 Chagua Faili la Backup (kama unalo)</button></div></div>${!APP.isEmployee?`<div class="card" style="border:2px solid var(--red);margin-top:14px;"><div class="card-body"><strong style="font-size:12.5px;color:var(--red);">☠️ Futa Akaunti Kabisa</strong><p style="font-size:11px;color:var(--ink-soft);margin:6px 0 10px;">Hii itafuta AKAUNTI YAKO YOTE — data zote, miamala, wafanyakazi, kila kitu — KABISA na KUDUMU. HAKUNA njia ya kurudisha baada ya hapa.</p><input type="password" id="deleteAccountPin" placeholder="Weka PIN yako kuthibitisha" inputmode="numeric" maxlength="4" style="width:100%;margin-bottom:10px;box-sizing:border-box;"><button class="btn-ghost" id="deleteAccountBtn" style="width:100%;border-color:var(--red);color:var(--red);font-weight:800;">☠️ Futa Akaunti Yangu Kabisa</button></div></div>`:''}</div>`:''}`;const downloadBackupBtn=main.querySelector('#downloadBackupBtn');if(downloadBackupBtn)downloadBackupBtn.addEventListener('click',downloadFullBackup);const deleteAccountBtn=main.querySelector('#deleteAccountBtn');if(deleteAccountBtn)deleteAccountBtn.addEventListener('click',async()=>{const enteredPin=main.querySelector('#deleteAccountPin').value.trim();const realPin=storageGet('pin');const pinOk=enteredPin&&await verifyPin(enteredPin,realPin);if(!pinOk){showToast('❌ PIN si sahihi — akaunti haijafutwa');return;}if(!confirm('HAKIKA KABISA? Akaunti yako YOTE, data, miamala, wafanyakazi — VYOTE vitafutwa KUDUMU. Hakuna njia ya kurudisha. Endelea?'))return;if(!confirm('Uthibitisho wa Mwisho: Bonyeza OK kufuta KABISA. Hii ni fursa yako ya mwisho kughairi.'))return;try{showToast('⏳ Inafuta akaunti...');const uid=APP.currentUser.uid;await fbDb.collection('users').doc(uid).delete();stopRealtimeSync();stopTxSafeguardListener();stopPeriodicReminder();storageSet('sheets','');storageSet('pin','');storageSet('lastUnlockTime','');storageSet('akauntiProfile','');await fbAuth.currentUser.delete();showToast('✅ Akaunti imefutwa kabisa. Kwaheri.');}catch(delErr){console.error('Account deletion failed',delErr);if(delErr.code==='auth/requires-recent-login'){showToast('⚠️ Kwa usalama, tafadhali "Toka" (logout) na "Ingia" tena, kisha jaribu kufuta mara moja');}else{showToast('Imeshindikana kufuta akaunti: '+(delErr.message||'jaribu tena'));}}});const restoreBackupBtn=main.querySelector('#restoreBackupBtn');const restoreFileInput=main.querySelector('#restoreFileInput');if(restoreBackupBtn&&restoreFileInput){restoreBackupBtn.addEventListener('click',()=>{restoreFileInput.click();});restoreFileInput.addEventListener('change',()=>{const file=restoreFileInput.files&&restoreFileInput.files[0];if(file)restoreFromBackupFile(file);});}const restoreFromTextBtn=main.querySelector('#restoreFromTextBtn');const restoreTextArea=main.querySelector('#restoreTextArea');if(restoreFromTextBtn&&restoreTextArea){restoreFromTextBtn.addEventListener('click',()=>{const txt=restoreTextArea.value.trim();if(!txt){showToast('Bandika maandishi ya backup kwanza');return;}restoreFromBackupText(txt);});}const saveNowBtn2=main.querySelector('#saveNowSettingsBtn');if(saveNowBtn2)saveNowBtn2.addEventListener('click',()=>{persistSheetsNow();showToast('✅ Imehifadhiwa — salama kwenye simu na wingu');});const logoutBtn=main.querySelector('#logoutBtn');if(logoutBtn)logoutBtn.addEventListener('click',()=>{if(!confirm('Una uhakika unataka kutoka? Utahitaji email na password kuingia tena.'))return;storageSet('lastUnlockTime','0');fbAuth.signOut();});const testCloudSaveBtn=main.querySelector('#testCloudSaveBtn');if(testCloudSaveBtn)testCloudSaveBtn.addEventListener('click',async()=>{testCloudSaveBtn.disabled=true;testCloudSaveBtn.textContent='Inajaribu...';try{await saveSheetsToCloud();showToast('✅ Jaribio limekamilika — angalia ujumbe hapo juu kwa matokeo kamili');}catch(err){console.error('Test save failed',err);showToast('❌ IMESHINDIKANA: '+(err&&err.message?err.message:String(err)));storageSet('lastCloudSaveError',err&&err.message?err.message:String(err));}testCloudSaveBtn.disabled=false;testCloudSaveBtn.textContent='🧪 Jaribu Kuhifadhi Sasa';renderSettingsTabContent(main);});const recoverTxBtn=main.querySelector('#recoverTxBtn');if(recoverTxBtn)recoverTxBtn.addEventListener('click',async()=>{recoverTxBtn.disabled=true;recoverTxBtn.textContent='Inapakua...';showToast('🔍 Inapakua data kutoka Wingu na Safu Salama...');try{const targetUid=APP.dataOwnerUid||APP.currentUser.uid;const docSnap=await fbDb.collection('users').doc(targetUid).get();const cloudData=docSnap.exists?docSnap.data():null;const cloudSheets=cloudData&&cloudData.sheets?cloudData.sheets:[];const activeCloudSheet=cloudSheets.find(sh=>sh.id===APP.activeId)||cloudSheets[0]||null;const cloudTxs=(activeCloudSheet&&activeCloudSheet.data&&activeCloudSheet.data.transactions)?activeCloudSheet.data.transactions:[];const safeTxs=(await loadTransactionsFromSafeguard())||[];let dailyBackupTxs=[];try{const backupsSnap=await fbDb.collection('users').doc(targetUid).collection('dailyBackups').orderBy('savedAt','desc').limit(10).get();backupsSnap.forEach(bdoc=>{const bdata=bdoc.data();const bsheets=(bdata&&bdata.sheets)||[];const bsheet=bsheets.find(sh=>sh.id===APP.activeId)||bsheets[0];if(bsheet&&bsheet.data&&Array.isArray(bsheet.data.transactions)){dailyBackupTxs=dailyBackupTxs.concat(bsheet.data.transactions);}});}catch(bErr){console.error('Daily backup fetch failed',bErr);}const sNow=activeSheet();const localTxs=sNow.data.transactions||[];const mergedMap={};[...cloudTxs,...safeTxs,...dailyBackupTxs,...localTxs].forEach(t=>{if(t&&t.id)mergedMap[t.id]=t;});const mergedList=Object.values(mergedMap).sort((a,b)=>(((b&&b.tarehe)||'')+((b&&b.muda)||'')).localeCompare(((a&&a.tarehe)||'')+((a&&a.muda)||'')));if(mergedList.length>localTxs.length){sNow.data.transactions=mergedList;if(activeCloudSheet&&activeCloudSheet.data){Object.keys(activeCloudSheet.data).forEach(k=>{if(k!=='transactions'&&(sNow.data[k]===undefined||(Array.isArray(sNow.data[k])&&sNow.data[k].length===0))){sNow.data[k]=activeCloudSheet.data[k];}});}storageSet('sheets',JSON.stringify({sheets:APP.sheets,activeId:APP.activeId}));storageSet('pendingCloudSync','1');storageSet('lastCloudSaveError','');showToast('✅ Miamala '+mergedList.length+' yamerudishwa (Wingu + Safu Salama). Itatumwa Wingu upya kiotomatiki.');}else{showToast('⚠️ Hakuna miamala ya ziada iliyopatikana kwenye Wingu au Safu Salama.');}}catch(err){console.error('Cloud restore failed',err);showToast('❌ Imeshindikana: '+(err&&err.message?err.message:String(err)));}recoverTxBtn.disabled=false;recoverTxBtn.textContent='🛟 Rudisha Data kutoka Wingu';renderMain();});const empAddBtn=main.querySelector('#empAddBtn');if(empAddBtn)empAddBtn.addEventListener('click',()=>{APP.employeeFormOpen=!APP.employeeFormOpen;renderSettingsTabContent(main);});main.querySelectorAll('[data-emp-del]').forEach(btn=>{btn.addEventListener('click',async()=>{const i=+btn.getAttribute('data-emp-del');const emp=(APP.employeesList||[])[i];if(!emp)return;if(!confirm('Ondoa '+(emp.name||emp.email)+' kama mfanyakazi?'))return;try{await removeEmployee(emp);APP.employeesList.splice(i,1);showToast('Mfanyakazi ameondolewa');renderSettingsTabContent(main);}catch(e){showToast('Imeshindikana kuondoa — jaribu tena');}});});renderEmployeeForm(main);const cpBtn=main.querySelector('#changePinBtn');if(cpBtn)cpBtn.addEventListener('click',()=>{APP.pinMode='change-old';APP.pinBuffer='';APP.lockError=null;document.getElementById('appRoot').style.display='none';renderLock();});const savePinRecoveryBtn=main.querySelector('#savePinRecoveryBtn');if(savePinRecoveryBtn)savePinRecoveryBtn.addEventListener('click',()=>{const qEl=main.querySelector('#pinRecoveryQ');const aEl=main.querySelector('#pinRecoveryA');const q=qEl?qEl.value.trim():'';const a=aEl?aEl.value.trim():'';if(!q||!a){showToast('Jaza swali na jibu vyote');return;}storageSet('pinRecoveryQ',q);storageSet('pinRecoveryA',a.toLowerCase());showToast('✅ Swali la kuokoa PIN limehifadhiwa');renderSettingsTabContent(main);});const shareAppBtn=main.querySelector('#shareAppBtn');if(shareAppBtn)shareAppBtn.addEventListener('click',()=>{const msg='📱 *AKILI WAKALA CONNECT* 🇹🇿'+String.fromCharCode(10)+String.fromCharCode(10)+'App bora ya kusimamia biashara yako ya Wakala — Miamala, Float, Cash, Madeni, Amana, Ripoti, na zaidi — vyote sehemu moja!'+String.fromCharCode(10)+String.fromCharCode(10)+'✅ Rahisi kutumia'+String.fromCharCode(10)+'✅ Inafanya kazi bila mtandao'+String.fromCharCode(10)+'✅ Data yako iko salama'+String.fromCharCode(10)+String.fromCharCode(10)+'Jaribu leo! 🚀';shareTextContent('AKILI WAKALA CONNECT',msg);});const openWinguAuthBtn=main.querySelector('#openWinguAuthBtn');if(openWinguAuthBtn)openWinguAuthBtn.addEventListener('click',()=>{APP.authMode='register';APP.authStep='form';APP.authError=null;APP.authPhoneDraft='';APP.authEmailDraft='';APP.authPinDraft='';renderAuthScreen();});const downloadBackupBtnMain=main.querySelector('#downloadBackupBtnMain');if(downloadBackupBtnMain)downloadBackupBtnMain.addEventListener('click',async()=>{try{const backupObj={exportedAt:new Date().toISOString(),activeId:APP.activeId,sheets:APP.sheets};const jsonStr=JSON.stringify(backupObj,null,2);const filename='akili-backup-'+today()+'.json';const blob=new Blob([jsonStr],{type:'application/json'});const opened=await uploadAndOpenExternally(blob,filename,'application/json');if(!opened){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('✅ Nakala imepakuliwa — ihamishe Google Drive au WhatsApp kwako mwenyewe');}storageSet('lastManualBackupDownload',today());}catch(err){console.error('Backup download failed',err);showToast('❌ Imeshindikana kupakua nakala: '+(err&&err.message?err.message:String(err)));}});const enterPlanCodeBtn=main.querySelector('#enterPlanCodeBtn');if(enterPlanCodeBtn)enterPlanCodeBtn.addEventListener('click',()=>{showPromptModal('Weka Msimbo wa Bando','mfano AB12CD34','',(val)=>{if(!val)return;const result=checkUnlockCode(val);if(result){if(result.owner){storageSet('ownerUnlocked','1');if(FB_OK&&APP.dataOwnerUid){fbDb.collection('users').doc(APP.dataOwnerUid).set({ownerUnlocked:'1'},{merge:true}).catch(()=>{});}}else{const expiry=addDaysStr(today(),result.days);storageSet('subscriptionExpiry',expiry);storageSet('ownerUnlocked','0');if(FB_OK&&APP.dataOwnerUid){fbDb.collection('users').doc(APP.dataOwnerUid).set({subscriptionExpiry:expiry,ownerUnlocked:'0'},{merge:true}).catch(()=>{});}}showToast('✅ '+result.label+' — imewashwa!');renderSettingsTabContent(main);}else{showToast('Msimbo si sahihi kwa kifaa hiki');}});});const previewTrialScreenBtn=main.querySelector('#previewTrialScreenBtn');if(previewTrialScreenBtn)previewTrialScreenBtn.addEventListener('click',()=>{renderTrialExpiredScreen(true);});const genCodeBtn=main.querySelector('#genCodeBtn');if(genCodeBtn)genCodeBtn.addEventListener('click',()=>{const devInp=main.querySelector('#genDeviceIdInput');const planSel=main.querySelector('#genPlanSelect');const devId=devInp?devInp.value.trim().toUpperCase():'';const planKey=planSel?planSel.value:'wiki';if(!devId){showToast('Weka namba ya kifaa cha mteja kwanza');return;}const code=computeDeviceCode(devId,planKey);const resultEl=main.querySelector('#genCodeResult');if(resultEl)resultEl.innerHTML=`<div style="background:var(--surface);border:1.5px dashed var(--green);border-radius:8px;padding:10px;text-align:center;margin-top:10px;"><div style="font-size:10.5px;color:var(--ink-soft);">Msimbo wa Kumpa Mteja</div><div style="font-size:18px;font-weight:900;font-family:'Courier New',monospace;color:var(--green);letter-spa a Sasa</div>`,steps:['Muhtasari wa haraka wa Salio lako lote (Cash + Float ya mitandao yote)','Nenda Menu → "Salio Langu" kuona kwa haraka bila kupitia sehemu nyingine']},{title:'📝 Shughuli za Timu',icon:'📝',mockup:`<div style="background:linear-gradient(135deg,#3E7A4E,#295234);border-radius:14px;padding:16px;color:#fff;text-align:center;font-size:11px;font-weight:800;">👤 Juma alifanya miamala 5 leo</div>`,steps:['Kama una wafanyakazi, ona shughuli za kila mmoja wao','Nani alifanya muamala gani, lini','Nenda Menu → "Shughuli za Timu" (Mmiliki pekee anaona hii)']},{title:'🔍 Tafuta Mteja',icon:'🔍',mockup:`<div style="background:linear-gradient(135deg,#5C6B9E,#3D4A70);border-radius:14px;padding:16px;color:#fff;text-align:center;font-size:11px;font-weight:800;">🔎 Andika jina la mteja...</div>`,steps:['Tafuta haraka historia yote ya mteja fulani (miamala, madeni, amana)','Nenda "Wateja Wangu" → Tafuta kwa jina']},{title:'🔍 Ukaguzi wa Siku',icon:'🔍',mockup:`<div style="background:linear-gradient(135deg,#5C6B9E,#3D4A70);border-radius:14px;padding:16px;color:#fff;text-align:center;font-size:11px;font-weight:800;">✅ Salio Linalingana na Kumbukumbu?</div>`,steps:['Linganisha Cash/Float halisi (uliyohesabu kwa mkono) na kile App inachosema','Husaidia kubaini hitilafu za haraka kabla hazijawa kubwa','Nenda Menu → "Ukaguzi wa Siku"']},{title:'👥 Wateja Wangu',icon:'👥',mockup:`<div style="background:linear-gradient(135deg,#B8862E,#7A5A1E);border-radius:14px;padding:16px;color:#fff;text-align:center;font-size:11px;font-weight:800;">👤 Juma — Miamala 12, Deni 0</div>`,steps:['Orodha kamili ya wateja wote uliowahi kuwahudumia','Ona historia ya kila mteja: miamala, madeni, amana kwa pamoja','Nenda Menu → "Wateja Wangu"']},{title:'⚙️ Data na Mipangilio',icon:'⚙️',mockup:`<div style="background:var(--paper,#fff);border:2px dashed #134C72;border-radius:14px;padding:14px;text-align:center;font-size:11px;font-weight:800;color:#134C72;">🔓 Ruhusu Kuhariri</div>`,steps:['"Data" — badilisha Cash/Float, ongeza/futa akaunti za mitandao','LAZIMA ubonyeze "🔓 Ruhusu Kuhariri" kabla ya kubadilisha chochote','"Mipangilio" — badilisha PIN, wafanyakazi, mandhari ya App, na zaidi']}];function renderMwongozoTab(main){const openIdx=APP.mwongozoOpenIdx;main.innerHTML=`<h2 class="section-title">📘 Mwongozo wa App</h2><p class="hint" style="margin:-6px 0 14px;">Bonyeza sehemu yoyote kuona maelezo kamili. Mwongozo huu unasasishwa kila tunapoongeza kipengele kipya.</p>${MWONGOZO_SECTIONS.map((sec,i)=>`<div class="card" style="margin-bottom:${sec.big?'16px':'10px'};overflow:hidden;${sec.big?'border:3px solid #2ECC71;box-shadow:0 6px 18px -6px rgba(46,204,113,.5);':''}"><div data-mwongozo-toggle="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:${sec.big?'18px 18px':'14px 16px'};cursor:pointer;background:${openIdx===i?'var(--surface)':(sec.big?'rgba(46,204,113,.08)':'transparent')};"><span style="font-weight:900;font-size:${sec.big?'16px':'13px'};${sec.big?'color:#1E8449;':''}">${esc(sec.title)}</span><span style="font-size:${sec.big?'20px':'16px'};transform:rotate(${openIdx===i?'180deg':'0deg'});transition:transform .2s;">▾</span></div>${openIdx===i?`<div style="padding:0 ${sec.big?'18px 20px':'16px 16px'};">${sec.mockup}<div style="margin-top:16px;">${sec.steps.map((st,si)=>`<div style="display:flex;gap:10px;padding:${sec.big?'10px 0':'6px 0'};font-size:${sec.big?'15px':'12px'};line-height:1.7;${sec.big?'border-bottom:1px dashed #d0e8d8;':''}"><span style="flex:none;font-weight:900;color:${sec.big?'#1E8449':'var(--blue)'};font-size:${sec.big?'16px':'inherit'};">${si+1}.</span><span style="${sec.big?'font-weight:600;':''}">${esc(st)}</span></div>`).join('')}</div></div>`:''}</div>`).join('')}`;main.querySelectorAll('[data-mwongozo-toggle]').forEach(el=>{el.addEventListener('click',()=>{const idx=+el.getAttribute('data-mwongozo-toggle');APP.mwongozoOpenIdx=APP.mwongozoOpenIdx===idx?null:idx;renderMwongozoTab(main);});});}function renderNambaWakalaTab(main){const d=activeSheet().data;const subTab='till';const editOn=APP.nambaWakalaEditMode;main.innerHTML=`<h2 class="section-title">${t('t_nambawakala')}</h2><div class="card"><div class="card-body"><div class="fbtns" style="margin-bottom:4px;"><button class="${editOn?'btn-ghost':'btn-primary'}" id="nw-edit-toggle">${editOn?'🔒 Zuia Kuhariri':'🔓 Ruhusu Kuhariri'}</button></div>${renderStickerCarouselHtml(d,editOn,subTab)}</div></div>`;const editToggle=main.querySelector('#nw-edit-toggle');if(editToggle)editToggle.addEventListener('click',()=>{const wasEditing=APP.nambaWakalaEditMode;APP.nambaWakalaEditMode=!APP.nambaWakalaEditMode;if(wasEditing&&!APP.nambaWakalaEditMode){persistSheetsNow();showToast('✅ Data imehifadhiwa');}renderNambaWakalaTab(main);});main.querySelectorAll('[data-sticker-dl]').forEach(btn=>{btn.addEventListener('click',()=>{const idx=btn.getAttribute('data-sticker-dl');const card=main.querySelector('[data-sticker-idx="'+idx+'"]');if(card){const stk=getWakalaStickers(d)[+idx];shareReceiptAsImage(card,'Stika_'+(stk?stk.network.replace(/\s+/g,'_'):'wakala')+'.png');}});});main.querySelectorAll('[data-stk-code]').forEach(inp=>{inp.addEventListener('input',()=>{const i=+inp.getAttribute('data-stk-code');const list=getWakalaStickers(d);if(list[i]){list[i].code=inp.value;saveSheetsDebounced();}});});main.querySelectorAll('[data-stk-jina]').forEach(inp=>{inp.addEventListener('input',()=>{const i=+inp.getAttribute('data-stk-jina');const list=getWakalaStickers(d);if(list[i]){list[i].jina=inp.value;saveSheetsDebounced();}});});}function buildProfitTrendSvg(trend){const W=320,H=170,padL=44,padR=14,padT=16,padB=28;const vals=trend.map(t=>t.faida);const maxV=Math.max(...vals,1);const minV=Math.min(...vals,0);const range=(maxV-minV)||1;const n=trend.length;const stepX=(W-padL-padR)/Math.max(1,n-1);function xFor(i){return padL+i*stepX;}function yFor(v){return padT+(1-(v-minV)/range)*(H-padT-padB);}const pts=trend.map((t,i)=>({x:xFor(i),y:yFor(t.faida),t}));const pathD=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');const areaD=pathD+' L'+pts[pts.length-1].x.toFixed(1)+','+(H-padB)+' L'+pts[0].x.toFixed(1)+','+(H-padB)+' Z';const zeroY=yFor(0);const gridLines=[0,0.5,1].map(f=>{const yv=minV+f*range;const yy=yFor(yv);return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/><text x="${padL-6}" y="${(yy+3).toFixed(1)}" font-size="8" fill="var(--ink-soft)" text-anchor="end">${fmtMoneyShort(yv)}</text>`;}).join('');const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.t.isCurrent?4:3}" fill="${p.t.faida<0?'var(--red)':'var(--blue)'}" stroke="var(--paper)" stroke-width="2"/>`).join('');const labels=pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${H-8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-weight="${p.t.isCurrent?'800':'500'}">${esc(p.t.label)}</text>`).join('');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible;"><defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>${gridLines}<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1"/><path d="${areaD}" fill="url(#trendFill)"/><path d="${pathD}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;}function fmtMoneyShort(v){const av=Math.abs(v);if(av>=1000000)return(v/1000000).toFixed(1)+'M';if(av>=1000)return(v/1000).toFixed(0)+'K';return String(Math.round(v));}function renderRipotiTab(main){if(APP.ripotiNetworkDetail){renderRipotiNetworkDetail(main,APP.ripotiNetworkDetail);return;}APP.ripotiStart=today();APP.ripotiEnd=today();const d0=activeSheet().data;if(!APP.plMonth)APP.p {faidaNetByDay[t.tarehe]=(faidaNetByDay[t.tarehe]||0)+(t.kamisheni||0);});matumizi.forEach(m=>{faidaNetByDay[m.tarehe]=(faidaNetByDay[m.tarehe]||0)-(m.kiasi||0);});const graphDays=Object.keys(faidaNetByDay).sort();const graphPoints=graphDays.map(dt=>({label:dt,value:faidaNetByDay[dt]}));const graphSvg=buildTrendChartSvg(graphPoints);const todayDay=parseInt(today().split('-')[2],10);let kamisheniReminderHtml='';if(todayDay>=1&&todayDay<=5){const kList=kamisheniMweziHuu(d);const kRows=KAMISHENI_NETWORKS.map(net=>{const entry=kList.find(k=>k.mtandao===net);return`<div class="srow"><span class="slabel">${net}</span><span class="sval ${entry?'pos':''}">${entry?fmtMoney(entry.kiasi)+' ✅':'⏳ Bado'}</span></div>`;}).join('');kamisheniReminderHtml=`<div class="card"><div class="card-head c-yellow"><span>📋 Ukusanyaji wa Kamisheni ya Mitandao (Tarehe 1-5)</span></div><div class="card-body"><p class="pay-hint" style="margin:0 0 10px;">Kumbuka kukusanya kamisheni ya mwezi huu kutoka kwa kila mtandao. Weka kwenye Nyumbani.</p><div class="summary">${kRows}</div></div></div>`;}const narrative='📊 RIPOTI YA WAKALA\n━━━━━━━━━━━━━━━\n\n'+lines.join('\n')+'\n\n━━━━━━━━━━━━━━━\nImeandikwa na AKILI WAKALA CONNECT 🤝';out.innerHTML=`<h1 class="print-only">AKILI WAKALA CONNECT — Ripoti ya Kifedha</h1><p class="ripoti-range">Ripoti ya <b>${sameDay?esc(formatDateDMY(start)):esc(formatDateDMY(start))+' hadi '+esc(formatDateDMY(end))}</b></p><div class="stat-grid" style="margin-bottom:16px;"><div class="stat-card"><div class="slab">Idadi ya Miamala</div><div class="sfig">${idadiJumla}</div></div><div class="stat-card"><div class="slab">Idadi ya Matumizi</div><div class="sfig">${matumizi.length}</div></div><div class="stat-card hi wide"><div class="slab">Faida ya Kamisheni</div><div class="sfig">${fmtMoney(faidaKamisheni)}</div></div><div class="stat-card wide" style="background:${faidaBaada<0?'var(--red-soft)':'var(--green-soft)'}"><div class="slab">Faida Baada ya Matumizi</div><div class="sfig" ="card-body" style="background:#FAFAF7;"><p id="rp-narrative-text" class="narrative-notebook">${esc(narrative)}</p><p style="font-size:10.5px;color:var(--ink-soft);margin:10px 0 0;">Imetengenezwa: ${esc(formatDateDMY(today()))}</p></div></div>`;const copyBtn=document.getElementById('rp-copy-btn');if(copyBtn)copyBtn.addEventListener('click',()=>{const txt=document.getElementById('rp-narrative-text').textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>showToast('Ripoti imenakiliwa')).catch(()=>showToast('Imeshindikana kunakili'));}else{showToast('Kunakili hakuungwi mkono kwenye kivinjari hiki');}});}function renderBankStatementOutput(){const out=document.getElementById('bs-output');if(!out)return;const d=activeSheet().data;const p=APP.bsPeriod;const{start:periodStart,end:periodEnd}=getBsPeriodRange();const periodLabel=p==='custom'?'Kipindi Maalum':p==='leo'?'Leo':p==='wiki'?'Wiki Hii':'Mwezi Huu';const{entries,openingBalance,closingBalance}=computeBankStatement(d,periodStart,periodEnd);const jumlaKuingia=entries.reduce((s,e)=>s+(e.delta>0?e.delta:0),0);const jumlaKutoka=entries.reduce((s,e)=>s+(e.delta<0?Math.abs(e.delta):0),0);const badilikoHalisi=jumlaKuingia-jumlaKutoka;const idadiMiamala=entries.length;const networkMap={};entries.forEach(e=>{if(!e.mtandao)return;if(!networkMap[e.mtandao])networkMap[e.mtandao]={in:0,out:0,count:0};networkMap[e.mtandao].count++;if(e.delta>=0)networkMap[e.mtandao].in+=e.delta;else networkMap[e.mtandao].out+=Math.abs(e.delta);});const networkRows=Object.keys(networkMap).map(net=>{const nm=networkMap[net];return`<tr><td>${networkLogoHtml(net,16)} ${esc(net)}</td><td class="num">${nm.count}</td><td class="num bs-in-amt">${fmt(nm.in)}</td><td class="num bs-out-amt">${fmt(nm.out)}</td></tr>`;}).join('');const rows=entries.map((e,idx)=>{const isCredit=e.delta>=0;return`<tr><td class="mono">${esc(formatDateDMY(e.tarehe))}</td><td class="mono">${esc(e.muda||'—')}</td><td>${e.mtandao? o</strong></td><td class="num"><strong>${fmtMoney(closingBalance)}</strong></td></tr></tbody></table></div><p class="bs-scroll-hint no-print">↔️ Sogeza kidole kushoto/kulia kuona zaidi</p></div>${networkRows?`<h4 style="font-size:13px;margin:20px 0 8px;color:var(--ink);">📡 Mgawanyo kwa Mtandao</h4><div class="bs-table-card"><div class="bs-scroll-wrap"><table><thead><tr><th>Mtandao</th><th class="num">Idadi</th><th class="num">Kuingia</th><th class="num">Kutoka</th></tr></thead><tbody>${networkRows}</tbody></table></div></div>`:''}<div style="display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:11px;color:var(--ink-soft);"><div style="flex:1;"><div style="border-top:1px solid var(--line);padding-top:4px;">Sahihi ya Wakala</div></div><div style="flex:1;"><div style="border-top:1px solid var(--line);padding-top:4px;">Muhuri (Stamp)</div></div></div><p style="font-size:10.5px;color:var(--ink-soft);margin:12px 0 0;">Imetengenezwa: ${esc(formatDateDMY(today()))}. Salio = Cash + Float yote ya akaunti zako.</p></div></div>`;}</script><div class="chat-lightbox" id="chatLightbox"><button class="chat-lightbox-close" id="chatLightboxClose">✕</button><img id="chatLightboxImg" src=""></div></body></html>
